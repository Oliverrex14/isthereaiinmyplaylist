    </g>

    <!-- Supported Streaming Platforms Strip -->
    <g transform="translate(0, 422)">
      <text x="0" y="15" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#887f73" letter-spacing="1.2">SUPPORTS:</text>
      
      <!-- Spotify -->
      <g transform="translate(86, -4)">
        <rect width="102" height="28" rx="5" fill="#191613" stroke="#332c23" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#1ed760"/>
        <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#faf7f2">Spotify</text>
      </g>

      <!-- Apple Music -->
      <g transform="translate(200, -4)">
        <rect width="124" height="28" rx="5" fill="#191613" stroke="#332c23" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#fa2d48"/>
        <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#faf7f2">Apple Music</text>
      </g>

      <!-- YouTube Music -->
      <g transform="translate(336, -4)">
        <rect width="138" height="28" rx="5" fill="#191613" stroke="#332c23" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#ff0000"/>
        <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#faf7f2">YouTube Music</text>
      </g>
    </g>

    <!-- Bottom Left Signature -->
    <g transform="translate(0, 488)">
      <text x="0" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#ea580c" letter-spacing="1.5">
        ISTHEREAIINMYPLAYLIST.TECH
      </text>
    </g>
  </g>

  <!-- 4. Right Column: The Forensic Audit Dossier (x: 648, y: 52) -->
  <g transform="translate(648, 52)" filter="url(#dossierShadow)">
    
    <!-- Outer Archival Card Base -->
    <rect width="490" height="490" rx="14" fill="#1b1814" stroke="#3a3227" stroke-width="2"/>

    <!-- Archival Top Header -->
    <rect width="490" height="48" rx="14" fill="#24201a"/>
    <line x1="0" y1="48" x2="490" y2="48" stroke="#3a3227" stroke-width="1.5"/>

    <!-- Card Title & Serial -->
    <text x="20" y="30" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#d4cdc3" letter-spacing="1">
      FORENSIC AUDIT // DOSSIER #8492
    </text>

    <!-- Main Alert Badge -->
    <g transform="translate(320, 11)">
      <rect width="150" height="26" rx="5" fill="#dc2626"/>
      <circle cx="12" cy="13" r="3.5" fill="#ffffff"/>
      <text x="24" y="18" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" font-weight="900" fill="#ffffff">42% SYNTHETIC</text>
    </g>

    <!-- Forensic Ratio Meter -->
    <g transform="translate(20, 68)">
      <text x="0" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#887f73" letter-spacing="1">PROVENANCE SPECTRUM BREAKDOWN</text>
      
      <!-- Multi-tier bar -->
      <g transform="translate(0, 8)">
        <rect width="450" height="18" rx="5" fill="#12100d"/>
        <!-- 58% Human -->
        <rect x="0" width="258" height="18" rx="5" fill="url(#emeraldGrad)"/>
        <!-- 14% Inconclusive -->
        <rect x="261" width="63" height="18" fill="#d97706"/>
        <!-- 28% AI Farm -->
        <rect x="326" width="124" height="18" rx="5" fill="url(#crimsonGrad)"/>
      </g>

      <!-- Meter Legend -->
      <g transform="translate(0, 42)">
        <circle cx="4" cy="-3" r="3.5" fill="#22c55e"/>
        <text x="13" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#faf7f2">58% HUMAN</text>

        <circle cx="160" cy="-3" r="3.5" fill="#d97706"/>
        <text x="169" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#faf7f2">14% INCONCLUSIVE</text>

        <circle cx="330" cy="-3" r="3.5" fill="#ef4444"/>
        <text x="339" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#faf7f2">28% AI SLOP</text>
      </g>
    </g>

    <!-- Track Inspection Cards (The "Before & After" Evidence) -->
    <g transform="translate(20, 148)">
      
      <!-- Track 1: Flagged Synthetic AI Stream-Farm Track -->
      <g transform="translate(0, 0)">
        <rect width="450" height="88" rx="8" fill="#221b18" stroke="#522521" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="4" y2="88" stroke="#ef4444" stroke-width="8"/>
        
        <!-- Track details -->
        <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#faf7f2">
          "Rain Sleep Resonance" • Ghost Ambient Co.
        </text>
        <text x="18" y="44" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444">
          ⚠️ 62 releases/month • Missing ISRC • Synthetic distribution hub
        </text>
        <text x="18" y="62" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#b0a89c">
          Audio footprint: Suno/Udio prompt architecture
        </text>

        <!-- Danger pill -->
        <rect x="334" y="14" width="102" height="22" rx="4" fill="#dc2626"/>
        <text x="385" y="29" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="900" fill="#ffffff" text-anchor="middle">
          96% AI FARM
        </text>
      </g>

      <!-- Track 2: Verified Real Human Artist Track -->
      <g transform="translate(0, 98)">
        <rect width="450" height="88" rx="8" fill="#171e17" stroke="#244226" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="4" y2="88" stroke="#22c55e" stroke-width="8"/>

        <!-- Track details -->
        <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#faf7f2">
          "Blood Bank" • Bon Iver
        </text>
        <text x="18" y="44" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#22c55e">
          ✓ Pre-2023 discography anchor • Jagjaguwar imprint
        </text>
        <text x="18" y="62" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#b0a89c">
          MusicBrainz human performer ID verified
        </text>

        <!-- Safe pill -->
        <rect x="322" y="14" width="114" height="22" rx="4" fill="#16a34a"/>
        <text x="379" y="29" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="900" fill="#ffffff" text-anchor="middle">
          0% HUMAN CRAFT
        </text>
      </g>

      <!-- Summary Audit Note -->
      <g transform="translate(0, 196)">
        <rect width="450" height="52" rx="6" fill="#14120f" stroke="#2d261e" stroke-width="1"/>
        <text x="16" y="22" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#d4cdc3">
          VERDICT: 21 OF 50 TRACKS ARE SYNTHETIC STREAM-FARMS
        </text>
        <text x="16" y="38" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#887f73">
          Royalty leakage: ~$340/month estimated siphoned from human artists
        </text>
      </g>
    </g>

    <!-- Physical Archival Stamp (Rotated -11deg) -->
    <g transform="translate(360, 394) rotate(-11)" filter="url(#stampDistress)">
      <circle cx="50" cy="50" r="48" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 3"/>
      <circle cx="50" cy="50" r="42" fill="#1b1814" stroke="#ea580c" stroke-width="1.2"/>
      <text x="50" y="36" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ea580c" text-anchor="middle" letter-spacing="1.5">★ KEEP MUSIC HUMAN ★</text>
      <text x="50" y="52" font-family="Georgia, serif" font-size="12" font-weight="900" fill="#faf7f2" text-anchor="middle">AUDITED</text>
      <text x="50" y="67" font-family="ui-monospace, monospace" font-size="8" font-weight="800" fill="#ea580c" text-anchor="middle" letter-spacing="1">ARCHIVE 2026</text>
    </g>
  </g>

  <!-- 5. Bottom Right Disclaimer -->
  <g transform="translate(1128, 592)">
    <text x="0" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#756d61" text-anchor="end">
      100% FREE &amp; OPEN SOURCE • ZERO LOGIN • PRIVACY-FIRST
    </text>
  </g>
</svg>
