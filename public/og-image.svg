<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Clean, warm dark background gradient -->
    <radialGradient id="cleanBg" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#1e1b17"/>
      <stop offset="100%" stop-color="#12110f"/>
    </radialGradient>

    <!-- Warm terracotta highlight -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#cleanBg)"/>

  <!-- Elegant Minimal Border -->
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="#2c2620" stroke-width="1.5"/>

  <!-- All Content Perfectly Centered & Balanced -->
  <g text-anchor="middle">
    
    <!-- Top Pill: Eyebrow -->
    <g transform="translate(600, 142)">
      <rect x="-155" y="-18" width="310" height="36" rx="18" fill="#201c18" stroke="#3a3229" stroke-width="1.2"/>
      <circle cx="-130" cy="0" r="4.5" fill="#ea580c"/>
      <text x="-116" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#faf7f2" letter-spacing="1.5" text-anchor="start">🌿 KEEP MUSIC HUMAN</text>
    </g>

    <!-- Main Headline (Huge, crystal clear, serif) -->
    <text x="600" y="260" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#faf7f2" letter-spacing="-1.5">
      Is There AI in Your Playlist?
    </text>

    <!-- Subtitle (Clean & readable) -->
    <text x="600" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#b8b0a2">
      Detect synthetic ghost artists and streaming-farms. Free, open, and transparent.
    </text>

    <!-- Supported Platforms: Minimal Pill Badges -->
    <g transform="translate(600, 412)">
      <!-- Spotify -->
      <g transform="translate(-190, 0)">
        <rect x="-66" y="-18" width="132" height="36" rx="8" fill="#1b1814" stroke="#332b22" stroke-width="1"/>
        <circle cx="-42" cy="0" r="4.5" fill="#1ed760"/>
        <text x="-30" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#faf7f2" text-anchor="start">Spotify</text>
      </g>

      <!-- Apple Music -->
      <g transform="translate(0, 0)">
        <rect x="-76" y="-18" width="152" height="36" rx="8" fill="#1b1814" stroke="#332b22" stroke-width="1"/>
        <circle cx="-52" cy="0" r="4.5" fill="#fa2d48"/>
        <text x="-40" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#faf7f2" text-anchor="start">Apple Music</text>
      </g>

      <!-- YouTube -->
      <g transform="translate(190, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#1b1814" stroke="#332b22" stroke-width="1"/>
        <circle cx="-46" cy="0" r="4.5" fill="#ff0000"/>
        <text x="-34" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#faf7f2" text-anchor="start">YouTube</text>
      </g>
    </g>

    <!-- Bottom URL Signature -->
    <text x="600" y="525" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14.5" font-weight="800" fill="#ea580c" letter-spacing="1.2">
      isthereaiinmyplaylist.tech
    </text>
  </g>
</svg>
