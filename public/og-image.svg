<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient (Warm deep espresso to vignette edge) -->
    <radialGradient id="humanistBg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#1c1916"/>
      <stop offset="60%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0c0b0a"/>
    </radialGradient>

    <!-- Warm dot grid pattern -->
    <pattern id="craftDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.1" fill="#2d2823"/>
    </pattern>

    <!-- Terracotta Accent Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Deep Shadow Filter -->
    <filter id="softCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="url(#humanistBg)"/>
  <rect width="1200" height="630" fill="url(#craftDots)"/>

  <!-- 2. Outer Archival Framing with Registration Crosshairs -->
  <rect x="28" y="28" width="1144" height="574" rx="10" fill="none" stroke="#2c2722" stroke-width="1.5"/>
  <rect x="36" y="36" width="1128" height="558" rx="6" fill="none" stroke="#221e1a" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Corner Crosshairs -->
  <g stroke="#ea580c" stroke-width="1.5" opacity="0.65">
    <path d="M22 28 h12 M28 22 v12"/>
    <path d="M1166 28 h12 M1172 22 v12"/>
    <path d="M22 602 h12 M28 596 v12"/>
    <path d="M1166 602 h12 M1172 596 v12"/>
  </g>

  <!-- 3. Left Column: Messaging & Metadata -->
  <g transform="translate(68, 68)">
    
    <!-- Eyebrow Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="376" height="34" rx="17" fill="#24201c" stroke="#3d352e" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4.5" fill="#ea580c"/>
      <text x="28" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#faf7f2" letter-spacing="1.2">🌿 INDIE MUSIC ARCHIVE • KEEP MUSIC HUMAN</text>
    </g>

    <!-- Main Headline (Editorial / Humanist Typography) -->
    <g transform="translate(0, 95)">
      <text x="0" y="0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#faf7f2" letter-spacing="-1">
        Is There AI in
      </text>
      <text x="0" y="62" font-family="Georgia, Cambria, 'Times New Roman', serif" font-weight="700" font-size="52" fill="url(#terracottaGrad)" letter-spacing="-1">
        Your Playlist?
      </text>
    </g>

    <!-- Subheadline -->
    <g transform="translate(0, 204)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" fill="#d4cdc3" line-height="1.5">
        Independent audio forensics to protect authentic musicians
      </text>
      <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" fill="#d4cdc3">
        from synthetic stream-farms. Free, open, and transparent.
      </text>
    </g>

    <!-- 4 Feature Evidence Chips -->
    <g transform="translate(0, 280)">
      <!-- Chip 1: Pre-2023 Shield -->
      <g transform="translate(0, 0)">
        <rect width="244" height="36" rx="6" fill="#1c1916" stroke="#332c25" stroke-width="1.2"/>
        <text x="14" y="23" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#16a34a">✓ PRE-2023 DISCIPLINES</text>
      </g>
      <!-- Chip 2: MusicBrainz -->
      <g transform="translate(254, 0)">
        <rect width="254" height="36" rx="6" fill="#1c1916" stroke="#332c25" stroke-width="1.2"/>
        <text x="14" y="23" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#16a34a">✓ MUSICBRAINZ GRAPH</text>
      </g>
      <!-- Chip 3: Catalog Velocity -->
      <g transform="translate(0, 46)">
        <rect width="244" height="36" rx="6" fill="#1c1916" stroke="#332c25" stroke-width="1.2"/>
        <text x="14" y="23" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#16a34a">✓ VELOCITY TELEMETRY</text>
      </g>
      <!-- Chip 4: False-Flag Shield -->
      <g transform="translate(254, 46)">
        <rect width="254" height="36" rx="6" fill="#1c1916" stroke="#332c25" stroke-width="1.2"/>
        <text x="14" y="23" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#16a34a">✓ FALSE-FLAG SHIELD</text>
      </g>
    </g>

    <!-- Supported Sources Strip -->
    <g transform="translate(0, 420)">
      <text x="0" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8e867b" letter-spacing="1">SUPPORTS:</text>
      
      <!-- Spotify -->
      <rect x="76" y="-3" width="94" height="26" rx="4" fill="#1b1815" stroke="#312a23" stroke-width="1"/>
      <circle cx="88" cy="10" r="3.5" fill="#1ed760"/>
      <text x="97" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#faf7f2">Spotify</text>

      <!-- Apple Music -->
      <rect x="180" y="-3" width="118" height="26" rx="4" fill="#1b1815" stroke="#312a23" stroke-width="1"/>
      <circle cx="192" cy="10" r="3.5" fill="#fc3c44"/>
      <text x="201" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#faf7f2">Apple Music</text>

      <!-- YouTube Music -->
      <rect x="308" y="-3" width="130" height="26" rx="4" fill="#1b1815" stroke="#312a23" stroke-width="1"/>
      <circle cx="320" cy="10" r="3.5" fill="#ff0000"/>
      <text x="329" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#faf7f2">YouTube</text>
    </g>
  </g>

  <!-- 4. Right Column: Archival Forensic Dossier Card -->
  <g transform="translate(670, 72)" filter="url(#softCardShadow)">
    
    <!-- Main Dossier Card Container -->
    <rect width="460" height="456" rx="12" fill="#1c1916" stroke="#362f27" stroke-width="1.8"/>

    <!-- Dossier Header Bar -->
    <rect width="460" height="46" rx="12" fill="#24201c"/>
    <line x1="0" y1="46" x2="460" y2="46" stroke="#362f27" stroke-width="1.2"/>
    
    <!-- Dossier Header Titles -->
    <text x="20" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#d4cdc3" letter-spacing="1">
      FORENSIC DOSSIER // SPEC. 2026
    </text>

    <!-- Synthetic Alert Badge -->
    <rect x="300" y="11" width="142" height="24" rx="4" fill="#dc2626" opacity="0.95"/>
    <text x="312" y="27" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ffffff">34% SYNTHETIC</text>

    <!-- Multi-Tier Spectrum Bar Breakdown -->
    <g transform="translate(20, 68)">
      <text x="0" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#8e867b" letter-spacing="0.5">PLAYLIST PROVENANCE SPECTRUM</text>
      
      <!-- Progress Bar Container -->
      <g transform="translate(0, 10)">
        <rect width="420" height="18" rx="4" fill="#141311"/>
        <!-- Safe Segment (66%) -->
        <rect x="0" width="277" height="18" rx="4" fill="#16a34a"/>
        <!-- Inconclusive Segment (14%) -->
        <rect x="279" width="59" height="18" fill="#d97706"/>
        <!-- Flagged AI Segment (20%) -->
        <rect x="340" width="80" height="18" rx="4" fill="#dc2626"/>
      </g>

      <!-- Spectrum Legend -->
      <g transform="translate(0, 44)">
        <circle cx="4" cy="-3" r="3.5" fill="#16a34a"/>
        <text x="13" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#faf7f2">66% HUMAN</text>

        <circle cx="150" cy="-3" r="3.5" fill="#d97706"/>
        <text x="159" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#faf7f2">14% INCONCLUSIVE</text>

        <circle cx="320" cy="-3" r="3.5" fill="#dc2626"/>
        <text x="329" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#faf7f2">20% FLAGGED AI</text>
      </g>
    </g>

    <!-- Itemized Forensic Evidence Rows -->
    <g transform="translate(20, 150)">
      
      <!-- Row 1: Catalog Velocity Spike -->
      <g transform="translate(0, 0)">
        <rect width="420" height="48" rx="6" fill="#221e1a" stroke="#2e2720" stroke-width="1"/>
        <text x="14" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8b0a5">CATALOG VELOCITY</text>
        <text x="242" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#dc2626">48 TRACKS/MO [FARM]</text>
      </g>

      <!-- Row 2: MusicBrainz Registry Graph -->
      <g transform="translate(0, 56)">
        <rect width="420" height="48" rx="6" fill="#221e1a" stroke="#2e2720" stroke-width="1"/>
        <text x="14" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8b0a5">MUSICBRAINZ GRAPH</text>
        <text x="250" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#16a34a">VERIFIED HUMAN ID</text>
      </g>

      <!-- Row 3: Pre-2023 Anchor -->
      <g transform="translate(0, 112)">
        <rect width="420" height="48" rx="6" fill="#221e1a" stroke="#2e2720" stroke-width="1"/>
        <text x="14" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8b0a5">PROVENANCE ANCHOR</text>
        <text x="240" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#16a34a">PRE-2023 CATALOG OK</text>
      </g>

      <!-- Row 4: Distributor / Ghost Label -->
      <g transform="translate(0, 168)">
        <rect width="420" height="48" rx="6" fill="#221e1a" stroke="#2e2720" stroke-width="1"/>
        <text x="14" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8b0a5">DISTRIBUTOR FINGERPRINT</text>
        <text x="248" y="28" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ea580c">SUSPICIOUS UPLOAD HUB</text>
      </g>
    </g>

    <!-- Stamped Physical Wax / Ink Seal (Rotated -8deg) -->
    <g transform="translate(330, 370) rotate(-8)" filter="url(#stampShadow)">
      <circle cx="45" cy="45" r="42" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="45" cy="45" r="37" fill="#1c1916" stroke="#ea580c" stroke-width="1.2"/>
      <text x="45" y="32" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#ea580c" text-anchor="middle" letter-spacing="1.5">KEEP MUSIC HUMAN</text>
      <text x="45" y="47" font-family="Georgia, serif" font-size="11" font-weight="900" fill="#faf7f2" text-anchor="middle">AUDITED</text>
      <text x="45" y="60" font-family="ui-monospace, monospace" font-size="7.5" font-weight="800" fill="#ea580c" text-anchor="middle" letter-spacing="1">ARCHIVE SPEC</text>
    </g>
  </g>

  <!-- 5. Bottom Brand Watermark -->
  <g transform="translate(68, 565)">
    <text x="0" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#faf7f2" letter-spacing="1.5">
      ISTHEREAIINMYPLAYLIST.TECH
    </text>
    <text x="1064" y="0" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#8e867b" text-anchor="end">
      100% FREE &amp; OPEN SOURCE • PROTECTING REAL MUSICIANS
    </text>
  </g>
</svg>
