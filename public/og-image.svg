<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient (Rich warm espresso with subtle vignette) -->
    <radialGradient id="bgVignette" cx="45%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#191714"/>
      <stop offset="60%" stop-color="#12110f"/>
      <stop offset="100%" stop-color="#090807"/>
    </radialGradient>

    <!-- Warm terracotta gradient for headline & accents -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Emerald Human gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Crimson Farm gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="archivalDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#2d2822" opacity="0.6"/>
    </pattern>

    <!-- Deep Elevation Shadow for Dossier Card -->
    <filter id="dossierShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Stamp Shadow -->
    <filter id="stampDistress" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1200" height="630" fill="url(#bgVignette)"/>
  <rect width="1200" height="630" fill="url(#archivalDots)"/>

  <!-- Concentric Vinyl Grooves Motif in background (Subtle, elegant) -->
  <g opacity="0.06" stroke="#faf7f2" fill="none" stroke-width="1.2">
    <circle cx="1120" cy="315" r="220"/>
    <circle cx="1120" cy="315" r="280"/>
    <circle cx="1120" cy="315" r="340"/>
    <circle cx="1120" cy="315" r="400"/>
    <circle cx="1120" cy="315" r="460"/>
    <circle cx="1120" cy="315" r="520"/>
    <circle cx="1120" cy="315" r="580"/>
  </g>

  <!-- 2. Archival Perimeter Frame & Technical Registration Marks -->
  <rect x="24" y="24" width="1152" height="582" rx="12" fill="none" stroke="#2c2722" stroke-width="1.5"/>
  <rect x="32" y="32" width="1136" height="566" rx="8" fill="none" stroke="#221e1a" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Corner registration crosshairs -->
  <g stroke="#ea580c" stroke-width="1.5" opacity="0.7">
    <path d="M18 24 h12 M24 18 v12"/>
    <path d="M1170 24 h12 M1176 18 v12"/>
    <path d="M18 606 h12 M24 600 v12"/>
    <path d="M1170 606 h12 M1176 600 v12"/>
  </g>

  <!-- 3. Left Column: Editorial & Brand Core (x: 64, y: 58) -->
  <g transform="translate(64, 58)">
    
    <!-- Eyebrow Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="374" height="34" rx="17" fill="#221d18" stroke="#3d352b" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="5" fill="#ea580c"/>
      <text x="30" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#faf7f2" letter-spacing="1.2">🌿 INDIE MUSIC ARCHIVE • KEEP MUSIC HUMAN</text>
    </g>

    <!-- Massive Display Headline -->
    <g transform="translate(0, 94)">
      <text x="0" y="0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-weight="800" font-size="56" fill="#faf7f2" letter-spacing="-1.5">
        Is There AI in
      </text>
      <text x="0" y="66" font-family="Georgia, Cambria, 'Times New Roman', serif" font-weight="800" font-size="56" fill="url(#terracottaGrad)" letter-spacing="-1.5">
        Your Playlist?
      </text>
    </g>

    <!-- Subtitle (Clear, punchy, authentic) -->
    <g transform="translate(0, 206)">
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="18.5" fill="#c7bfb4" line-height="1.5">
        Scan public Spotify, Apple Music &amp; YouTube playlists
      </text>
      <text x="0" y="28" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="18.5" fill="#c7bfb4">
        to detect synthetic ghost artists and protect real musicians.
      </text>
    </g>

    <!-- 4 High-Impact Forensics Badges -->
    <g transform="translate(0, 286)">
      <!-- Badge 1: Pre-2023 -->
      <g transform="translate(0, 0)">
        <rect width="248" height="38" rx="7" fill="#1b1814" stroke="#352e25" stroke-width="1.2"/>
        <text x="14" y="24" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#22c55e">✓ PRE-2023 CATALOG SHIELD</text>
      </g>
      <!-- Badge 2: Velocity Tracking -->
      <g transform="translate(260, 0)">
        <rect width="252" height="38" rx="7" fill="#1b1814" stroke="#352e25" stroke-width="1.2"/>
        <text x="14" y="24" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#22c55e">✓ CATALOG VELOCITY RADAR</text>
      </g>
      <!-- Badge 3: MusicBrainz Graph -->
      <g transform="translate(0, 48)">
        <rect width="248" height="38" rx="7" fill="#1b1814" stroke="#352e25" stroke-width="1.2"/>
        <text x="14" y="24" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#22c55e">✓ MUSICBRAINZ HUMAN ID</text>
      </g>
      <!-- Badge 4: Transparent Signals -->
      <g transform="translate(260, 48)">
        <rect width="252" height="38" rx="7" fill="#1b1814" stroke="#352e25" stroke-width="1.2"/>
        <text x="14" y="24" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#22c55e">✓ TRANSPARENT EVIDENCE</text>
